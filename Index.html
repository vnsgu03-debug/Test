<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #0e1621;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #17212b;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .user-avatar {
      width: 70px;
      height: 70px;
      background: #242f3d;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .user-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .status-text { color: #8293a4; font-size: 14px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="user-avatar">⚡</div>
    <div class="user-name" id="usercard"></div>
    <div class="status-text">Ready for Security Check</div>
  </div>

  <script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    tg.MainButton.textColor = '#FFFFFF';
    tg.MainButton.color = '#2cab37';
    let userip = "";

    fetch('https://api.ipify.org/?format=json')
      .then(response => response.json())
      .then(data => {
        userip = data.ip;
        console.log('User IP Address:', userip);
        tg.MainButton.setText("Click to complete the verification");
        tg.MainButton.show();
      })
      .catch(error => console.error('Error retrieving IP address:', error));

    Telegram.WebApp.onEvent("mainButtonClicked", function(){
      tg.sendData(userip);
    });

    let usercard = document.getElementById("usercard");
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      let p = document.createElement("p");
      p.innerText = `${tg.initDataUnsafe.user.first_name || ''} ${tg.initDataUnsafe.user.last_name || ''}`;
      usercard.appendChild(p);
    }
  </script>

</body>
</html>
